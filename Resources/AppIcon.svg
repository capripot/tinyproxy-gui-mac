<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- "smol proxy": a tiny blob that sits in the middle and passes packets through. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B21D6"/>
      <stop offset="0.55" stop-color="#B026D9"/>
      <stop offset="1" stop-color="#FF4F9A"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="3.2" fill="#FFFFFF" fill-opacity="0.13"/>
    </pattern>
    <linearGradient id="blob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F3E8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#2A0A4A" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- macOS squircle tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>

  <g stroke="#1A1033" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)">
    <!-- incoming packets -->
    <rect x="176" y="556" width="36" height="36" rx="10" fill="#C6FF3D" stroke-width="10"/>
    <rect x="238" y="542" width="64" height="64" rx="16" fill="#C6FF3D" stroke-width="12"/>

    <!-- outgoing arrow -->
    <path d="M700 574 H812" fill="none" stroke-width="56"/>
    <path d="M700 574 H812" fill="none" stroke="#C6FF3D" stroke-width="32"/>
    <path d="M796 512 L878 574 L796 636 Z" fill="#C6FF3D" stroke-width="12"/>

    <!-- antenna -->
    <path d="M512 382 C512 340 540 318 556 290" fill="none" stroke-width="16"/>
    <circle cx="562" cy="270" r="30" fill="#C6FF3D" stroke-width="12"/>

    <!-- the proxy blob -->
    <path d="M512 376
             C640 376 724 456 724 572
             C724 690 640 760 512 760
             C384 760 300 690 300 572
             C300 456 384 376 512 376 Z"
          fill="url(#blob)" stroke-width="22"/>
  </g>

  <!-- face -->
  <g fill="#1A1033">
    <ellipse cx="446" cy="556" rx="28" ry="40"/>
    <ellipse cx="578" cy="556" rx="28" ry="40"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="456" cy="540" r="10"/>
    <circle cx="588" cy="540" r="10"/>
  </g>
  <g fill="#FF4F9A" fill-opacity="0.45">
    <ellipse cx="394" cy="628" rx="34" ry="20"/>
    <ellipse cx="630" cy="628" rx="34" ry="20"/>
  </g>
  <path d="M478 628 q17 26 34 0 q17 26 34 0" fill="none" stroke="#1A1033" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkles -->
  <path d="M760 214 C766 252 774 260 812 266 C774 272 766 280 760 318 C754 280 746 272 708 266 C746 260 754 252 760 214 Z" fill="#C6FF3D"/>
  <path d="M842 352 C845 370 849 374 867 377 C849 380 845 384 842 402 C839 384 835 380 817 377 C835 374 839 370 842 352 Z" fill="#FFFFFF"/>
  <path d="M232 268 C236 292 240 296 264 300 C240 304 236 308 232 332 C228 308 224 304 200 300 C224 296 228 292 232 268 Z" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
